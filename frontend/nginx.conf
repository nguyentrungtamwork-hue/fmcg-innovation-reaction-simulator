server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every route serves index.html (React Router handles it).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; index.html stays fresh.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
