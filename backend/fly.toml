# Fly.io config — FastAPI backend (Docker). Deploy from this dir: `fly deploy`.
app = "mirofish-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "fly"
  DEMO_MODE = "true"
  FRONTEND_ORIGIN = "https://frontend-omega-fawn-79.vercel.app"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
